name: Build and deploy zynthec Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download owned IPA release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apps >/dev/null 2>&1; then
            gh release download apps --pattern '*.ipa' --dir .
          else
            echo "::warning::Release 'apps' does not exist yet; deploying the admin page with an empty source."
          fi
      - name: Build source and admin page
        run: python3 scripts/build.py
      - name: Validate output
        run: python3 -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
