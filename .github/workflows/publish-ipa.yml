name: Publish IPA

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Direct HTTPS URL of the IPA to publish
        required: true
      asset_name:
        description: Filename in the apps release, ending in .ipa
        required: true

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate input
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          case "$ARTIFACT_URL" in https://*) ;; *) exit 1 ;; esac
          case "$ASSET_NAME" in *.ipa) ;; *) exit 1 ;; esac
      - name: Download IPA
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: curl --fail --location --proto '=https' --output "$ASSET_NAME" "$ARTIFACT_URL"
      - name: Create release if needed and upload
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          gh release view apps >/dev/null 2>&1 || gh release create apps --title "App downloads" --notes "Binary releases used by zynthec Source."
          gh release upload apps "$ASSET_NAME" --clobber
          gh workflow run deploy.yml
